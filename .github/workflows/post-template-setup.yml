name: Post-Template Setup

on: [push]

jobs:
  setup:
    # Only run on repositories created FROM the template, not on the template itself
    if: github.repository != 'eonm-pro/.datalab'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Customize Scripts
        run: |
          # 1. Define your new values based on the new repository info
          NEW_PROJECT_NAME="${{ github.event.repository.name }}"
          NEW_AUTHOR_NAME="${{ github.repository_owner }}"

          # 2. Find and replace placeholders in your targeted files
          # (Add or modify the file paths below as needed)
          sed -i "s/\.datalab/$NEW_PROJECT_NAME/g" init.sh
          sed -i "s/eonm-pro/$NEW_AUTHOR_NAME/g" init.sh
          sed -i "s/\.datalab/$NEW_PROJECT_NAME/g" README.md
          sed -i "s/eonm-pro/$NEW_AUTHOR_NAME/g" README.md

      - name: Clean Up and Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage changed scripts
          git add init.sh
          git add README.md
          
          # Remove this setup workflow file so it only runs once (Self-destruct)
          git rm .github/workflows/post-template-setup.yml

          # Remove the LICENSE file. The LICENSE is the one of the template
          git rm LICENSE
          
          git commit -m "chore: initial template customization and cleanup"
          git push
